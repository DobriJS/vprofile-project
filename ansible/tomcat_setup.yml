- name: Common tool setup on all the servers
  hosts: appsrvgrp
  become: yes
  vars:
    tom_url: https://archive.apache.org/dist/tomcat/tomcat-8/v8.5.37/bin/apache-tomcat-8.5.37.tar.gz

  tasks:
    - name: Install software-properties-common (Ubuntu)
      apt:
        name: software-properties-common
        state: present
      when: ansible_distribution == 'Ubuntu'

    - name: Add OpenJDK PPA for Java 8 (Ubuntu)
      apt_repository:
        repo: 'ppa:openjdk-r/ppa'
        state: present
      when: ansible_distribution == 'Ubuntu'

    - name: Install JDK 8 on Ubuntu
      apt:
        name: openjdk-8-jdk
        state: present
        update_cache: yes
      when: ansible_distribution == 'Ubuntu'

    - name: Install JDK on CentOS 7
      yum:
        name: java-1.8.0-openjdk.x86_64
        state: present
      when: ansible_distribution == 'CentOS'

    - name: Set Java 8 as default
      alternatives:
        name: java
        path: /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java
        link: /usr/bin/java
      when: ansible_distribution == 'Ubuntu'

    - name: Download Tomcat Tar Ball
      get_url:
        url: "{{ tom_url }}"
        dest: /tmp/tomcat-8.tar.gz

    - name: Add tomcat group
      group:
        name: tomcat
        state: present

    - name: Add tomcat user
      user:
        name: tomcat
        group: tomcat
        shell: /bin/nologin
        home: /usr/local/tomcat8

    - name: Create temp extraction directory
      file:
        path: /tmp/tomcat8
        state: directory

    - name: Extract tomcat
      unarchive:
        src: /tmp/tomcat-8.tar.gz
        dest: /tmp/tomcat8/
        remote_src: yes
        list_files: yes
      register: unarchive_info

    - name: Move Tomcat to /usr/local/tomcat8
      command: "cp -r /tmp/tomcat8/{{ unarchive_info.files[0].split('/')[0] }}/. /usr/local/tomcat8/"

    - name: Change ownership of /usr/local/tomcat8
      file:
        path: /usr/local/tomcat8
        owner: tomcat
        group: tomcat
        recurse: yes

    - name: Setup tomcat SVC file on modern Ubuntu/CentOS (Systemd)
      template:
        src: templates/ubuntu16-svcfile.j2
        dest: /etc/systemd/system/tomcat.service
        mode: "0644"
      when: (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version >= '16') or (ansible_distribution == 'CentOS' and ansible_distribution_major_version == '7')

    - name: Setup tomcat SVC file on legacy systems (Init.d)
      template:
        src: templates/ubuntu14_15-svcfile.j2
        dest: /etc/init.d/tomcat
        mode: "0755"
      when: (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version < '16') or (ansible_distribution == 'CentOS' and ansible_distribution_major_version == '6')

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: ansible_service_mgr == 'systemd'

    - name: Start & Enable Tomcat 8
      service:
        name: tomcat
        state: started
        enabled: yes